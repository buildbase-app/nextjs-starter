name: Signed-in E2E

# Signed-in end-to-end tests against the deployed demo, after each deploy to
# Cloudflare and on demand. The test user is signed in by exchanging an org
# API token for a session (e2e/live/auth.setup.ts); no browser sign-in.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   BUILDBASE_E2E_API_TOKEN  an org API token from the console
#   BUILDBASE_E2E_USER_ID    optional: the test user's id; only an owner or
#                            admin token may name one, otherwise the session
#                            is the token's own user
#   BUILDBASE_E2E_SSO_EMAIL     optional: an identity-provider test user whose
#   BUILDBASE_E2E_SSO_PASSWORD  email domain belongs to an active enterprise;
#                               without them the enterprise SSO test is skipped
# Until BUILDBASE_E2E_API_TOKEN is set, this workflow skips instead of failing.

on:
  workflow_run:
    workflows: ['Deploy to Cloudflare']
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'App to test'
        default: 'https://demo.buildbase.app'

concurrency:
  group: e2e-signed-in
  cancel-in-progress: true

jobs:
  e2e:
    name: Signed-in pages
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: ${{ inputs.base_url || 'https://demo.buildbase.app' }}
      NEXT_PUBLIC_BUILDBASE_SERVER_URL: https://api.console.buildbase.app
      BUILDBASE_E2E_API_TOKEN: ${{ secrets.BUILDBASE_E2E_API_TOKEN }}
      BUILDBASE_E2E_USER_ID: ${{ secrets.BUILDBASE_E2E_USER_ID }}
      BUILDBASE_E2E_SSO_EMAIL: ${{ secrets.BUILDBASE_E2E_SSO_EMAIL }}
      BUILDBASE_E2E_SSO_PASSWORD: ${{ secrets.BUILDBASE_E2E_SSO_PASSWORD }}

    steps:
      - name: Check for the API token
        id: token
        run: |
          if [ -n "$BUILDBASE_E2E_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::BUILDBASE_E2E_API_TOKEN is not set; skipping signed-in tests."
          fi

      - name: Checkout code
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.token.outputs.present == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.token.outputs.present == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run signed-in tests
        if: steps.token.outputs.present == 'true'
        run: npm run test:e2e:live

      - name: Upload report and videos
        if: always() && steps.token.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-signed-in
          path: |
            playwright-report-live/
            test-results/
          retention-days: 14
